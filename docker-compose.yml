# Pro Synology Container Manager (Project) NEBO `docker compose` z příkazové řádky.
#
#   docker compose up -d                                 běží pořád (doporučeno)
#   docker compose run --rm scraper python main.py check ověří zdroje proti živým webům
#   docker compose run --rm scraper python main.py top   nejlepší aktuální nabídky
#   docker compose run --rm scraper python main.py test-telegram

services:
  scraper:
    # Hotový image z GitHubu (sestaví ho .github/workflows/docker.yml po každé změně).
    # Aktualizace: update-on-nas.sh (Plánovač úloh). Vlastní sestavení z kódu místo toho:
    #   docker build -t ghcr.io/kuvycz/scraper:latest .
    image: ghcr.io/kuvycz/scraper:latest
    container_name: flip-scraper
    env_file: .env
    environment:
      - DB_PATH=data/flip.db   # uvnitř /app/data (mountnutý volume) -> přežije restart
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 256m            # NAS má 1 GB RAM; scraper si vystačí s desítkami MB
